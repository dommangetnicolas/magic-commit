name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test
        run: swift test

      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build-app.sh --universal --zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/MagicCommit.zip \
            --title "Magic Commit ${GITHUB_REF_NAME#v}" \
            --generate-notes
