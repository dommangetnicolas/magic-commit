name: Release

# Publishes a release when a "release/vX.Y.Z" pull request (opened by the
# Prepare release workflow) is merged, or when a vX.Y.Z tag is pushed by hand.

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/v'))
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${HEAD_REF#release/}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a release tag: $tag"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build universal app
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: ./scripts/build-app.sh --universal --zip

      - name: Tag the merge commit
        if: github.event_name == 'pull_request'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Magic Commit $VERSION"
          git push origin "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          scripts/changelog.sh notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [[ -s "$RUNNER_TEMP/notes.md" ]]; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$TAG" build/MagicCommit.zip \
            --title "Magic Commit $VERSION" --verify-tag "${notes[@]}"
